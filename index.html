<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cozy Chaos</title>
<meta name="description" content="A cozy WarioWare-style pile of 19 tiny microgames. Slice bread, slap carrots, tuck in the moon.">
<link rel="icon" href="sprites/loaf_happy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#bfe3ff;font-family:"DotGothic16",ui-monospace,monospace;color:#3b302b;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  #sky{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
  #app{position:absolute;left:50%;top:50%;width:1120px;height:660px;translate:-50% -50%}

  /* chunky pixel panels + speech bubbles */
  .panel{background:#fff8f0;padding:10px 14px;box-shadow:0 0 0 4px #3b302b,6px 6px 0 4px #3b302b33}
  .lbl{font-size:14px;color:#b06a5f;letter-spacing:1px}
  .lbl i{font-style:normal;color:#3b302b88;margin-left:6px}
  .say{background:#fff;padding:10px 14px 12px;font-size:22px;line-height:1.1;box-shadow:0 0 0 4px #3b302b,6px 6px 0 4px #3b302b33;position:relative}
  .say::after{content:"";position:absolute;left:46px;bottom:-14px;width:14px;height:14px;background:inherit;box-shadow:4px 4px 0 0 #3b302b;rotate:45deg;scale:1 .8}
  .say small{display:block;font-size:15px;margin-top:4px;color:#b06a5f}
  .say.lose{background:#e6ecff}
  .say.lose small{color:#5a6ea8}
  .say.pop{animation:pop .25s}

  /* left: score board + announcer */
  #board{position:absolute;left:24px;top:22px;width:236px}
  #board .num{font-size:30px;letter-spacing:3px;line-height:1.05;margin-bottom:6px}
  #board .two{display:flex;justify-content:space-between;font-size:20px}
  #board .two b{font-weight:normal;color:#3b302b}
  #ann{position:absolute;left:12px;top:206px;width:262px;height:440px}
  #ann .say{position:absolute;left:4px;right:0;bottom:282px}
  #annImg{position:absolute;left:4px;bottom:0;width:250px}
  .hop{animation:hop .35s steps(4)}
  @keyframes hop{40%{translate:0 -16px}}

  /* centre: the handheld */
  #device{position:absolute;left:290px;top:20px;width:540px;height:620px;background:linear-gradient(#ffdbe1,#f5b6c2);border-radius:30px 30px 30px 90px;
    box-shadow:inset 0 -10px 0 #e298a7,inset 0 6px 0 #fff8,0 14px 0 #c47586,0 26px 34px #0003}
  #device .brand{text-align:center;padding-top:12px;font-size:18px;color:#9a4f5e;letter-spacing:3px}
  #device .brand i{font-style:normal;font-size:13px;margin-left:8px;color:#9a4f5e99}
  #bezel{margin:8px 12px 0;padding:18px;background:#3b3550;border-radius:14px 14px 14px 46px;box-shadow:inset 0 0 0 4px #2a2540,inset 0 8px 0 #fff1;position:relative}
  #bezel .led{position:absolute;left:6px;top:150px;width:8px;height:8px;border-radius:50%;background:#ff6b7f;box-shadow:0 0 8px #ff6b7f}
  #bezel .led::after{content:"BATT";position:absolute;left:-2px;top:12px;font-size:8px;color:#fff6;writing-mode:vertical-rl}
  .scr{position:relative;width:480px;height:360px}
  .glass{position:absolute;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(#0000 0 2px,#0000000a 2px 3px),linear-gradient(125deg,#fff3 0 18%,#fff0 30%)}
  .controls{position:relative;height:150px}
  .dpad{position:absolute;left:46px;top:34px;width:96px;height:96px}
  .dpad i{position:absolute;background:#3b3550;border-radius:6px;box-shadow:inset 0 -5px 0 #2a2540}
  .dpad i:first-child{left:32px;top:0;width:32px;height:96px}
  .dpad i:last-child{left:0;top:32px;width:96px;height:32px}
  .ab{position:absolute;right:44px;top:30px;width:150px;height:100px;rotate:-18deg}
  .ab b{position:absolute;width:56px;height:56px;border-radius:50%;background:#e05a6d;box-shadow:inset 0 -6px 0 #b8394d,0 4px 0 #9a4f5e;color:#fff9;font-weight:normal;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
  .ab b:active{translate:0 3px;box-shadow:inset 0 -3px 0 #b8394d}
  .ab b:first-child{left:0;top:34px}
  .ab b:last-child{right:0;top:0}
  .pills{position:absolute;left:0;right:0;top:118px;display:flex;justify-content:center;gap:26px}
  .pills span{width:52px;height:12px;border-radius:6px;background:#9a4f5e88;rotate:-18deg;font-size:10px;color:#9a4f5e;text-indent:-2px;line-height:36px;text-align:center}
  .speaker{position:absolute;right:58px;bottom:-24px;width:70px;height:40px;rotate:-30deg;background:repeating-linear-gradient(90deg,#c47586 0 5px,transparent 5px 12px)}

  /* right: lives, the pet, its mood */
  #side{position:absolute;left:862px;top:22px;width:236px}
  #lives{display:flex;gap:6px;margin-top:6px}
  #lives svg{width:42px;height:36px}
  #pet{position:relative;height:300px;margin:26px 0 22px}
  #pet .say{position:absolute;left:30px;top:0;font-size:20px;opacity:0;transition:opacity .15s}
  #pet .say.show{opacity:1}
  #petImg{position:absolute;left:50%;bottom:34px;width:150px;translate:-50% 0;cursor:pointer;transform-origin:50% 100%;animation:breathe 2.4s steps(6) infinite}
  @keyframes breathe{50%{scale:1 1.035}}
  #petImg.jump{animation:jump .5s steps(5)}
  @keyframes jump{40%{translate:-50% -34px}}
  #petImg.sulk{animation:shake .4s}
  .cushion{position:absolute;left:28px;right:28px;bottom:14px;height:34px;background:#f6b9c4;border-radius:50%;box-shadow:inset 0 -8px 0 #e298a7,0 0 0 4px #3b302b}
  .heartfx{position:absolute;pointer-events:none;animation:float 1s forwards}
  @keyframes float{to{translate:0 -70px;opacity:0}}
  .bgm{margin-top:22px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .bgm b{font-weight:normal;font-size:22px;margin-left:auto}
  .bgm small{font-size:11px;color:#3b302b66;padding:1px 5px;box-shadow:0 0 0 2px #3b302b44}
  .bgm:active{translate:2px 2px}
  .moodbar{height:16px;margin-top:8px;background:#f1e3d8;box-shadow:0 0 0 3px #3b302b}
  .moodbar i{display:block;height:100%;width:50%;background:repeating-linear-gradient(90deg,#e05a6d 0 10px,#ef7d8d 10px 12px);transition:width .3s steps(5)}

  #stage{position:relative;width:480px;height:360px;overflow:hidden;background:#fff;touch-action:none}

  /* ---- phone sideways: no device body, a big screen, slim panels ---- */
  #app.land #device{left:190px;top:3px;width:520px;height:auto;padding-bottom:2px;border-radius:24px}
  #app.land #device .brand, #app.land .controls{display:none}
  #app.land #bezel{margin:2px;padding:18px 18px}
  #app.land #board{left:6px;top:8px;width:166px;padding:8px 10px}
  #app.land #board .num{font-size:21px;letter-spacing:1px;margin-bottom:2px}
  #app.land #board .two{flex-direction:column;font-size:16px}
  #app.land #ann{left:2px;top:168px;width:184px;height:240px}
  #app.land #annImg{width:160px;left:6px}
  #app.land #ann .say{bottom:178px;font-size:16px;padding:6px 10px 8px}
  #app.land #ann .say small{font-size:12px}
  #app.land #side{left:726px;top:8px;width:166px}
  #app.land #lives svg{width:30px;height:26px}
  #app.land #lives{gap:4px}
  #app.land #pet{height:170px;margin:14px 0 12px}
  #app.land #petImg{width:96px;bottom:24px}
  #app.land .cushion{left:22px;right:22px;height:26px;bottom:10px}
  #app.land #pet .say{left:10px;font-size:15px;padding:4px 8px 6px}
  #app.land .bgm{margin-top:14px}

  /* ---- phone upright: score strip, device, announcer + cat underneath ---- */
  #app.tall #board{left:8px;top:8px;width:252px;padding:8px 12px}
  #app.tall #board .num{font-size:22px;letter-spacing:2px;margin-bottom:2px}
  #app.tall #board .two{font-size:15px}
  #app.tall #device{left:0;top:140px;height:572px}
  #app.tall .controls{height:132px}
  #app.tall .speaker{bottom:8px;right:40px}
  #app.tall #side{left:280px;top:8px;width:252px}
  #app.tall #lives svg{width:36px;height:31px}
  #app.tall .bgm{position:absolute;left:0;right:0;top:80px;margin:0;padding:6px 12px}
  #app.tall #side > .panel:has(.moodbar){display:none}
  #app.tall #pet{position:absolute;left:96px;top:710px;width:160px;height:182px;margin:0}
  #app.tall #petImg{width:104px;bottom:24px}
  #app.tall .cushion{left:14px;right:14px;height:26px;bottom:10px}
  #app.tall #pet .say{left:0;top:0;font-size:15px;padding:4px 8px 6px}
  #app.tall #ann{left:4px;top:722px;width:340px;height:176px}
  #app.tall #annImg{width:156px;left:0}
  #app.tall #ann .say{left:150px;right:4px;bottom:100px;font-size:17px;padding:6px 10px 8px}
  #app.tall #ann .say::after{left:-8px;bottom:12px}
  #app.tall #ann .say small{font-size:12px}
  #field{position:absolute;inset:0;overflow:hidden}
  .e{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none;transition:scale .15s,rotate .15s}
  .spr{transform:translate(-50%,-100%);-webkit-user-drag:none}          /* sprites are anchored bottom-centre */
  .pop{animation:pop .25s}
  @keyframes pop{50%{scale:1.2 .85}}
  .fall{animation:fall .5s linear forwards}
  @keyframes fall{to{translate:0 60px;opacity:0}}
  .fall-l{animation:fallL .7s cubic-bezier(.5,0,1,1) forwards}
  .fall-r{animation:fallR .7s cubic-bezier(.5,0,1,1) forwards}
  @keyframes fallL{to{translate:-46px 18px;rotate:-16deg}}
  @keyframes fallR{to{translate:46px 18px;rotate:16deg}}
  .bit{position:absolute;width:8px;height:8px;animation:bit .5s ease-out forwards}
  @keyframes bit{to{translate:var(--dx) var(--dy);opacity:0}}
  .shake{animation:shake .3s}
  @keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}

  #hud{position:absolute;left:0;right:0;top:0;height:10px;background:#0001;z-index:5}
  #bar{height:100%;width:0;background:#f4a6a6}
  #prompt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;font-size:52px;color:#fff;text-shadow:4px 4px 0 #3b302b;opacity:0;z-index:6;text-align:center;line-height:1.1}
  #prompt small{font-size:18px;text-shadow:2px 2px 0 #3b302b;margin-top:6px}
  #prompt.show{animation:prompt 1.1s steps(12) forwards}
  @keyframes prompt{0%{opacity:0;scale:.4}15%{opacity:1;scale:1.12}25%{scale:1}70%{opacity:1}100%{opacity:0;scale:1.05}}
  #screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#fff8f0;text-align:center;font-size:20px;z-index:10}
  #screen h1{margin:0;font-size:44px;font-weight:normal;color:#d98579;text-shadow:3px 3px 0 #3b302b22}
  #screen .big{font-size:60px}
  #screen .row img{height:56px;margin:0 6px}


  /* ---- per-game looks ---- */
  #stage.gb #prompt{color:#0f380f;text-shadow:4px 4px 0 #8bac0f}
  #stage.gb #prompt small{text-shadow:2px 2px 0 #8bac0f}
  #stage.gb #bar{background:#306230}
  .gb-lines{position:absolute;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(#0000 0 2px,#30623014 2px 3px)}
  .pix{position:absolute;width:6px;height:8px;background:#306230}
  .linen{background-color:#f3e9dc;background-image:linear-gradient(#d9c9b6 1px,transparent 1px),linear-gradient(90deg,#d9c9b6 1px,transparent 1px);background-size:12px 12px}
  .scarf{position:absolute;left:100px;top:140px;display:flex;filter:drop-shadow(0 4px 0 #0002)}
  .col{display:flex;flex-direction:column;animation:pop .2s}
  .cell{height:22px;box-shadow:inset 0 0 0 1px #0002,inset 0 -6px 0 #0001}
  .needle{position:absolute;width:6px;height:120px;background:#c49a6c;border-radius:3px;transform-origin:50% 100%;transition:rotate .08s}
  .needle::before{content:"";position:absolute;top:-8px;left:-4px;width:14px;height:14px;border-radius:50%;background:#e07a8a}
  .board{position:absolute;left:30px;right:30px;bottom:24px;height:120px;background:#c9925c;border-radius:20px;box-shadow:inset 0 -8px 0 #a8743f}
  .wall{position:absolute;top:268px;height:92px;background-size:104px 92px}
  .belt{position:absolute;left:0;right:0;top:150px;height:26px;background:repeating-linear-gradient(90deg,#6b5b73 0 20px,#5a4a62 20px 40px);box-shadow:0 4px 0 #3b302b;animation:belt .4s linear infinite}
  @keyframes belt{to{background-position:-40px 0}}
  .marker{position:absolute;left:238px;top:182px;height:150px;border-left:4px dashed #3b302b44}
  .ground{position:absolute;left:0;right:0;bottom:0;height:40px;background:#b5d39a;box-shadow:inset 0 4px 0 #8fb874}
  .tear{position:absolute;width:12px;height:16px;transform:translate(-50%,-50%);background:#7fd0f5;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:0 0 0 2px #2b6f9a}
  .keyhl{position:absolute;background:#ffd84d;opacity:0;mix-blend-mode:multiply;transition:opacity .08s}
  .keyhl.on{opacity:.85}
  .star{position:absolute;width:4px;height:4px;background:#fff8}
  .blanket{position:absolute;width:150px;height:70px;transform:translate(-50%,-50%);cursor:grab;
    background:radial-gradient(circle at 28% 55%,#f4f6ff 0 26px,transparent 27px),radial-gradient(circle at 55% 40%,#f4f6ff 0 32px,transparent 33px),radial-gradient(circle at 80% 60%,#f4f6ff 0 22px,transparent 23px),linear-gradient(#0000 55%,#f4f6ff 55% 88%,#0000 88%);
    filter:drop-shadow(3px 0 0 #8fa3c8) drop-shadow(-3px 0 0 #8fa3c8) drop-shadow(0 3px 0 #8fa3c8) drop-shadow(0 -3px 0 #8fa3c8)}
  .hole{position:absolute;width:150px;height:130px;overflow:hidden}
  .dirt{position:absolute;width:140px;height:26px;border-radius:50%;background:#6b4a32;box-shadow:inset 0 -6px 0 #533826}
  .arrows{position:absolute;left:0;right:0;top:50px;text-align:center;font-size:48px}
  .arrows span{margin:0 12px;color:#d5c4d0}
  .arrows .now{color:#3b302b}
  .arrows .done{color:#8bc28b}
  .vfish{position:absolute;transform:translate(-50%,-50%);color:#dfe6ff;font-size:28px;white-space:nowrap;text-shadow:0 0 8px #8fa3ff}
  .eyelid{position:absolute;width:16px;height:16px;transform:translate(-50%,-50%);background:#000}
  .glow{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(#ff2a2a 0 20%,#ff2a2a66 40%,transparent 70%);opacity:0}
  .redflash{position:absolute;inset:0;background:#ff000033;pointer-events:none}
  .static{position:absolute;pointer-events:none;background:repeating-linear-gradient(0deg,#fff 0 2px,#666 2px 3px,#bbb 3px 5px,#333 5px 6px);background-size:100% 12px;animation:static .12s steps(3) infinite;mix-blend-mode:hard-light}
  @keyframes static{to{background-position:0 12px}}
  .dial{position:absolute;border-radius:50%;cursor:grab}
  .well{position:absolute;background:repeating-linear-gradient(90deg,#ffffff0d 0 1px,transparent 1px 32px);box-shadow:inset 3px 0 0 #ffffff22,inset -3px 0 0 #ffffff22}
  .brick{position:absolute;width:32px;height:32px;background:url(sprites/wall_l.png) 0 0/64px 56px;box-shadow:inset 0 0 0 1px #0003}
  .ghost{position:absolute;outline:3px dashed #ffd84d99;outline-offset:-3px;animation:blink .6s steps(2) infinite}
  @keyframes blink{50%{outline-color:#ffd84d33}}
  .blk{position:absolute;width:64px;height:96px;background:url(sprites/stack_block.png) center/100% 100%;transition:left .05s,top .05s,rotate .08s}
  .mound{position:absolute;width:100px;height:24px;border-radius:50%;background:#8a5a3b;box-shadow:inset 0 -6px 0 #6e452c}
  .slapme{position:absolute;translate:-50% -50%;background:#fff;padding:2px 8px 4px;font-size:14px;white-space:nowrap;box-shadow:0 0 0 3px #3b302b;animation:pop .45s steps(3) infinite}
  .reticle{position:absolute;width:50px;height:50px;translate:-50% -50%;z-index:3;pointer-events:none;color:#4a86d8;
    background:linear-gradient(currentColor,currentColor) 50% 0/5px 13px no-repeat,linear-gradient(currentColor,currentColor) 50% 100%/5px 13px no-repeat,
      linear-gradient(currentColor,currentColor) 0 50%/13px 5px no-repeat,linear-gradient(currentColor,currentColor) 100% 50%/13px 5px no-repeat;
    filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff);
    animation:spin 2.4s steps(12) infinite}
  .reticle i{position:absolute;inset:9px;border:5px solid currentColor;border-radius:50%}
  .reticle-spot{position:absolute;width:30px;height:8px;translate:-50% -50%;border-radius:50%;background:#3b302b33;pointer-events:none}
  .reticle.good{color:#1f6fe0;scale:1.15}
  .reticle.bad{color:#e05a6d}
  .reticle.firing{animation-duration:.6s}
  @keyframes spin{to{rotate:360deg}}
  .wetbar{position:absolute;width:44px;height:8px;background:#fff;box-shadow:0 0 0 2px #3b302b}
  .wetbar i{display:block;height:100%;width:0;background:#6cc4ee}
  .wetbar.mad i{background:#e05a6d}
  .puddle{position:absolute;width:20px;height:8px;translate:-50% -50%;border-radius:50%;background:#7fd0f599;transition:width .2s}
  .drip{position:absolute;width:6px;height:6px;translate:-50% -50%;background:#7fd0f5;box-shadow:0 0 0 1px #2b6f9a66}
  .water{position:absolute;left:0;right:0;top:296px;bottom:0;background:#8fcfe4;box-shadow:inset 0 3px 0 #ffffff88}
  .streak{position:absolute;height:3px;background:linear-gradient(90deg,#fff0,#fff 25%,#fff);border-radius:2px}
  .streak.dark{height:2px;background:linear-gradient(90deg,#c9805a00,#c9805a 40%)}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="app">
  <div id="board" class="panel">
    <div class="lbl">SCORE<i>得点</i></div><div class="num" id="pts">0000000</div>
    <div class="lbl">HI-SCORE<i>最高</i></div><div class="num" id="hi">0000000</div>
    <div class="two"><span class="lbl">STAGE<i>面</i> <b id="stg">01</b></span><span class="lbl">SPEED<i>速</i> <b id="spd">×1.0</b></span></div>
  </div>
  <div id="ann"><div id="say" class="say">WELCOME!<small>ようこそ!</small></div><img id="annImg" src="sprites/ann_idle.png?v=7" alt=""></div>

  <div id="device">
    <div class="brand">COZY CHAOS<i>こじー・かおす</i></div>
    <div id="bezel"><span class="led"></span>
      <div class="scr">
        <div id="stage">
          <div id="field"></div>
          <div id="hud"><div id="bar"></div></div>
          <div id="prompt"></div>
          <div id="screen">loading…</div>
        </div>
        <div class="glass"></div>
      </div>
    </div>
    <div class="controls">
      <div class="dpad"><i></i><i></i></div>
      <div class="ab"><b>B</b><b>A</b></div>
      <div class="pills"><span>SELECT</span><span>START</span></div>
      <div class="speaker"></div>
    </div>
  </div>

  <div id="side">
    <div class="panel"><div class="lbl">LIFE<i>命</i></div><div id="lives"></div></div>
    <div id="pet"><div id="petSay" class="say">…</div><img id="petImg" src="sprites/cat_sit.png" alt=""><div class="cushion"></div></div>
    <div class="panel"><div class="lbl">MOOD<i>きげん</i></div><div class="moodbar"><i id="mood"></i></div></div>
    <div class="panel bgm" id="bgmBtn"><span class="lbl">BGM<i>音楽</i></span><b id="bgmState">ON</b><small>M</small></div>
  </div>
</div>
<script src="music.js"></script>
<script src="sfx.js"></script>
<script>
const W = 480, H = 360, $ = s => document.querySelector(s);
const stage = $('#stage'), field = $('#field'), bar = $('#bar'), promptEl = $('#prompt'), screen = $('#screen'), livesEl = $('#lives');
const app = $('#app'), sayEl = $('#say'), annImg = $('#annImg'), petImg = $('#petImg'), petSay = $('#petSay'), moodEl = $('#mood');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const MAX_LIVES = 4;
let mouse = { x: W / 2, y: H / 2 }, down = false, cur = null, score = 0, lives = MAX_LIVES, speed = 1, lastGame = -1, best = 0;
let prev = null, seg = null;   // swipe segment for this frame
let pts = 0, combo = 0, round = 0, mood = 5, bag = [];   // bag: shuffled games left this cycle
try { best = +localStorage.cozyPtsBest || 0 } catch (e) {}

// ---------- the announcer ----------

const sky = $('#sky'), sk = sky.getContext('2d'), PX = 6;
let clouds = [];
function mkCloud(x) {
  const w = rand(16, 34), n = 4 + Math.floor(rand(0, 3));
  return { x, y: rand(3, sky.height * .9), w, v: rand(.5, 1.5),
    puffs: Array.from({ length: n }, (_, i) => ({ dx: (i / (n - 1) - .5) * w * .8 + rand(-2, 2), dy: rand(-3, 1), r: rand(w * .16, w * .3) })) };
}
function sizeSky() {
  sky.width = Math.ceil(innerWidth / PX); sky.height = Math.ceil(innerHeight / PX);
  clouds = Array.from({ length: Math.ceil(sky.width / 26) }, () => mkCloud(rand(-20, sky.width)));
}
function drawSky(dt) {
  const gr = sk.createLinearGradient(0, 0, 0, sky.height);
  gr.addColorStop(0, '#8fd0ff'); gr.addColorStop(.6, '#cdeaff'); gr.addColorStop(1, '#ffe6ef');
  sk.fillStyle = gr; sk.fillRect(0, 0, sky.width, sky.height);
  for (const c of clouds) {
    c.x += c.v * dt; if (c.x - c.w > sky.width) Object.assign(c, mkCloud(-c.w));
    for (const [col, off] of [['#d8e6f5', 2], ['#ffffff', 0]])           // shade underneath, then the fluff
      for (const p of c.puffs) {
        const cx = Math.round(c.x + p.dx), cy = Math.round(c.y + p.dy + off), r = Math.round(p.r);
        sk.fillStyle = col;
        for (let y = -r; y <= r; y++) { const hw = Math.round(Math.sqrt(r * r - y * y)); sk.fillRect(cx - hw, cy + y, hw * 2 + 1, 1) }
      }
  }
}

// ---------- sound ----------
let ac;
function blip(f = 600, d = .1, type = 'sine', v = .07) {
  try {
    ac = ac || audioCtx();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(t + d);
  } catch (e) {}
}

// ---------- input ----------
// three layouts, each a fixed design size that is scaled to fit:
//   wide = desktop (everything side by side), land = phone sideways (big screen, slim panels),
//   tall = phone upright (score strip on top, device, announcer + cat below)
const LAYOUT = { wide: [1120, 660], land: [900, 410], tall: [540, 900] };
function fit() {
  const w = innerWidth, h = innerHeight;
  const mode = w < h ? 'tall' : (w >= 1000 && h >= 600) ? 'wide' : 'land';
  const [dw, dh] = LAYOUT[mode];
  app.className = mode; app.style.width = dw + 'px'; app.style.height = dh + 'px';
  app.style.scale = Math.min(w / (dw + 16), h / (dh + 16));
}
addEventListener('resize', fit); fit();
function loc(e) { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height } }
const live = () => cur && !cur.done;
addEventListener('pointermove', e => { mouse = loc(e) });
let touchInput = false;
stage.addEventListener('pointerdown', e => { touchInput = e.pointerType !== 'mouse'; mouse = loc(e); prev = { ...mouse }; down = true; if (live() && cur.g.onDown) cur.g.onDown() });
addEventListener('pointerup', () => { down = false; if (live() && cur.g.onUp) cur.g.onUp() });
addEventListener('keydown', e => { if (live() && cur.g.onKey) cur.g.onKey(e) });

// ---------- microgame api ----------
function makeApi(def) {
  const g = {
    dur: 4.5 / speed * (def.durMul || 1), speed,
    get mouse() { return mouse }, get down() { return down },
    add(html, cls) { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html || ''; field.appendChild(d); return d },
    img(name, x, y, scale) { const d = new Image(); d.className = 'e spr'; d.draggable = false; field.appendChild(d); g.set(d, name, scale); g.move(d, x, y); return d },
    set(d, name, scale = d.sc) { d.sc = scale; d.name = name; d.src = SPR[name].src; d.style.width = SPR[name].naturalWidth * scale + 'px' },
    w: d => SPR[d.name].naturalWidth * d.sc, h: d => SPR[d.name].naturalHeight * d.sc,
    move(d, x, y) { d.X = x; d.Y = y; d.style.left = x + 'px'; d.style.top = y + 'px' },
    place(d, x, y) { d.style.left = x + 'px'; d.style.top = y + 'px' },
    // hit tests for bottom-anchored sprites, in stage coords
    inside(d, x, y, pad = 0) { const w = g.w(d) / 2 + pad; return Math.abs(x - d.X) < w && y < d.Y + pad && y > d.Y - g.h(d) - pad },
    hit(d, pad = 0) { return g.inside(d, mouse.x, mouse.y, pad) },
    swiped(d, min = 6) {                       // did this frame's drag stroke cut through d?
      if (!seg || Math.hypot(seg.bx - seg.ax, seg.by - seg.ay) < min) return false;
      for (let i = 0; i <= 8; i++) if (g.inside(d, seg.ax + (seg.bx - seg.ax) * i / 8, seg.ay + (seg.by - seg.ay) * i / 8, -6)) return true;
      return false;
    },
    pop(d) { d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop') },
    shake(d) { d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake') },
    burst(x, y, color, n = 8) {
      for (let i = 0; i < n; i++) {
        const b = g.add('', 'bit'); g.place(b, x, y); b.style.background = color;
        b.style.setProperty('--dx', rand(-60, 60) + 'px'); b.style.setProperty('--dy', rand(-60, 40) + 'px');
        setTimeout(() => b.remove(), 500);
      }
    },
    later(ms, fn) { setTimeout(() => { if (cur && cur.g === g) fn() }, ms) },
    win() { finish(true) }, lose() { finish(false) },
  };
  return g;
}

  { name: 'SLAP!', hint: 'slap the ones asking for it, never the grumpy ones', bg: 'linear-gradient(#fff6d6 0 74%,#cfe6a8 74%)', durMul: 1.2, start(g) {
    const BASE = .78, GROUND = 318, need = 3;
    // every pose drawn at the same carrot size, with the carrot's body (not the sign or hand) on its spot:
    // [relative scale, body offset from sprite centre in natural px]
    const FIT = { carrot_kiss: [1, 0], carrot_notnow: [1, -31], carrot_slapped: [1.2, 26], carrot_laugh: [1.2, 0] };
    const show = (c, name) => { const [k, dx] = FIT[name]; g.set(c.d, name, BASE * k); g.move(c.d, c.x - dx * BASE * k, GROUND) };
    const carrots = [110, 240, 370].map(x => {
      g.place(g.add('', 'mound'), x - 50, GROUND - 12);
      const d = g.img('carrot_kiss', x, GROUND, BASE);
      const say = g.add('SLAP ME!', 'slapme'); g.place(say, x, GROUND - 168);
      return { x, d, say, state: 'no', t: 0 };
    });
    const set = (c, st) => {
      c.state = st; c.say.style.display = st === 'want' ? '' : 'none'; c.d.style.translate = '';
      show(c, { want: 'carrot_kiss', no: 'carrot_notnow', hit: 'carrot_slapped', laugh: 'carrot_laugh' }[st]);
      c.t = { want: rand(.6, 1.1) / Math.sqrt(g.speed), no: rand(.5, 1.2) / Math.sqrt(g.speed), hit: .18, laugh: .4 }[st];
    };
    const first = Math.floor(rand(0, 3));
    carrots.forEach((c, i) => set(c, i === first ? 'want' : 'no'));

    g.onDown = () => {
      const c = carrots.find(o => Math.abs(g.mouse.x - o.x) < 62 && g.mouse.y > GROUND - 175 && g.mouse.y < GROUND + 12);

      set(c, 'hit'); g.pop(c.d); SFX.play('slap', { rate: rand(.9, 1.1) });
      if (++slaps >= need) { carrots.forEach(o => o !== c && set(o, 'laugh')); g.later(180, () => set(c, 'laugh')); g.win() }
    };
    g.tick = (dt, t) => {
      for (const c of carrots) {
        if (c.state === 'want') c.d.style.translate = `0 ${-Math.abs(Math.sin(t * 10 + c.x)) * 5}px`;   // eager little hop
        if ((c.t -= dt) > 0) continue;
        if (c.state === 'hit') set(c, 'laugh');
        else if (c.state === 'laugh') set(c, 'no');
        else set(c, c.state === 'want' ? 'no' : 'want');
      }
      if (!carrots.some(c => c.state === 'want' || c.state === 'hit')) {            // always someone asking

  { name: 'CRY!', hint: 'aim at the flower, hold to cry', bg: 'linear-gradient(#eaf4ff 0 70%,#e8f1e4 70%)', start(g) {
    g.add('', 'ground');
    const onion = g.img('onion_sob', 80, 325, .72), GROUND = 322, T = .55, GRAV = 900, NEED = 110, MAD = 35;
    const slots = [240, 330, 420].sort(() => Math.random() - .5);
    const targets = [['flower_wilt', 'flower'], ['frog', 'frog'], ['cat_sit', 'cat']].map(([n, k], i) => {
      const puddle = g.add('', 'puddle'); g.place(puddle, slots[i], 327);
      const d = g.img(n, slots[i], 330, .8);
      const bar = g.add('<i></i>', 'wetbar' + (k === 'flower' ? '' : ' mad')); g.place(bar, slots[i] - 22, 330 - g.h(d) - 16);
      return { k, d, bar, puddle, wet: 0, fussT: -1 };
    });
    targets.find(o => o.k === 'flower').d.style.scale = '1 .8';          // droopy until watered
    const spot = g.add('', 'reticle-spot'), ret = g.add('<i></i>', 'reticle');   // aim marker + its shadow where tears land
    const eyeY = onion.Y - g.h(onion) * .52, eyes = [onion.X - 13, onion.X + 13];
    const drops = [];
    let aim = 170, spawn = 0, hiss = null, held = 0;
    g.onDown = () => { held = 0 };
    g.tick = (dt, t) => {
      held = g.down ? held + dt : 0;
      const crying = g.down && (!touchInput || held > .25);              // a finger gets a moment to aim first
      if (crying && !hiss) hiss = SFX.loop('stream', { vol: .35 });
      if (!crying && hiss) { hiss.stop(); hiss = null }
      aim += (clamp(g.mouse.x, 150, 470) - aim) * Math.min(1, dt * (touchInput ? 20 : 9));   // streams follow your aim, a little loosely
      const land = aim + Math.sin(t * 7) * 10;
      onion.style.scale = crying ? `${1 + Math.sin(t * 22) * .03} ${1 - Math.sin(t * 22) * .03}` : '';   // sobbing
      const over = targets.find(o => o.d.isConnected && Math.abs(o.d.X - land) < 36);
      g.place(ret, land, GROUND - 34); g.place(spot, land, GROUND);
      ret.className = 'reticle' + (over ? (over.k === 'flower' ? ' good' : ' bad') : '') + (crying ? ' firing' : '');
      if (crying && (spawn -= dt) <= 0) {
        spawn = .014;
        for (const ex of eyes) {
          const lx = land + (ex - onion.X) * .5 + rand(-4, 4);
          drops.push({ d: g.add('', 'drip'), x0: ex, vx: (lx - ex) / T, vy: (GROUND - eyeY - .5 * GRAV * T * T) / T, t: 0 });
        }
      }
      for (let i = drops.length - 1; i >= 0; i--) {
        const p = drops[i];
        p.t = Math.min(T, p.t + dt);                      // exact arc, so each drop lands right where it was aimed
        p.x = p.x0 + p.vx * p.t; p.y = eyeY + p.vy * p.t + .5 * GRAV * p.t * p.t; g.place(p.d, p.x, p.y);
        if (p.t < T) continue;
        p.d.remove(); drops.splice(i, 1);
        if (Math.random() < .08) g.burst(p.x, GROUND, '#7fd0f5', 3);
        const hit = targets.find(o => Math.abs(o.d.X - p.x) < 36);

        const f = Math.min(1, ++hit.wet / (hit.k === 'flower' ? NEED : MAD));

        hit.puddle.style.width = 20 + f * 60 + 'px';
        if (hit.k === 'flower') {
          hit.d.style.scale = `1 ${.8 + .25 * f}`;                         // perks up as it drinks
          if (f < 1) continue;

      }

  }},

  { name: 'COMPOSE!', hint: 'repeat the tune — click the keys or 1 2 3 4', bg: '#e9e4f7', durMul: 1.5, start(g) {

  { name: 'TUCK!', hint: 'drag the cloud blanket onto the moon', bg: '#1d2240', start(g) {

  { name: 'BOOP!', hint: 'boop the awake moles, not the sleepy ones', bg: '#a7d08c', start(g) {

  { name: 'FOLD!', hint: 'swipe the arrows in order', bg: '#f2e6f0', start(g) {

    const go = dir => {

    render();

  // ---- the extra sheet: panels keep their own backgrounds ----

    const dcx = kl + 76 * KS, dcy = kt + 108 * KS;
    const dial = g.add('', 'dial');
    dial.style.cssText += `left:${dcx - R}px;top:${dcy - R}px;width:${R * 2}px;height:${R * 2}px;background:url(sprites/tv_knob.png) ${-(76 * KS - R)}px ${-(108 * KS - R)}px/${kw}px ${kh}px`;
    const target = rand(120, 240) * (Math.random() < .5 ? 1 : -1);
    let ang = 0, lastA = null, grab = false, locked = 0;
    g.onDown = () => { grab = Math.hypot(g.mouse.x - dcx, g.mouse.y - dcy) < R + 30 };
    g.onUp = () => { grab = false; lastA = null };
    g.tick = dt => {
      if (grab) {
        const a = Math.atan2(g.mouse.y - dcy, g.mouse.x - dcx) * 180 / Math.PI;
        if (lastA !== null) { let d = a - lastA; if (d > 180) d -= 360; if (d < -180) d += 360; ang += d }
        lastA = a;
      }
      dial.style.rotate = ang + 'deg';
      let diff = Math.abs(((ang - target) % 360 + 540) % 360 - 180);
      const signal = clamp(1 - diff / 100, 0, 1);
      noise.style.opacity = 1 - signal * .9; face.style.opacity = signal * signal;
      if (diff < 14) { if ((locked += dt) > .4) { noise.remove(); face.style.opacity = 1; SFX.play('twinkle'); g.win() } }
      else locked = 0;
    };
  }},
];

// ?game=boop plays only that game (handy while tuning)
const only = new URLSearchParams(location.search).get('game');
if (only) GAMES.splice(0, GAMES.length, ...GAMES.filter(d => d.name.toLowerCase().startsWith(only.toLowerCase())));

// ---------- flow ----------
function renderLives() { livesEl.innerHTML = heartsHtml() }

function startGame() {
  screen.style.display = 'none'; field.innerHTML = ''; field.className = ''; field.style.translate = ''; down = false; SFX.stopAll();
  round++; renderBoard(); annSay('ready', pick(GO));
  if (!bag.length) {
    bag = GAMES.map((_, k) => k).sort(() => Math.random() - .5);
    if (bag.length > 1 && bag[bag.length - 1] === lastGame) [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
  }
  const i = bag.pop(); lastGame = i;
  const def = GAMES[i], g = makeApi(def);
  field.style.background = def.bg; stage.className = def.cls || '';
  cur = { g, t: 0, dur: g.dur, done: false, survive: !!def.survive };
  def.start(g);
  promptEl.innerHTML = def.name + '<small>' + def.hint + '</small>';
  promptEl.classList.remove('show'); void promptEl.offsetWidth; promptEl.classList.add('show');
  SFX.play('start');
}

function finish(ok) {
  if (!cur || cur.done) return;
  cur.done = true; SFX.stopAll(); BGM.tension(false);
  if (ok) { score++; combo++; pts += Math.round(100 * speed) + 50 * (combo - 1); SFX.play('win') }
  else { lives--; combo = 0; SFX.play('lose') }
  renderLives(); renderBoard(); proclaim(ok); petReact(ok ? 'win' : 'lose');
  setTimeout(interlude, 1400);
}

function showScreen(html, onclick) { screen.innerHTML = html; screen.style.display = 'flex'; screen.onclick = onclick || null }

function interlude() {
  stage.className = '';
  if (lives <= 0) return gameOver();
  const newSpeed = Math.min(2.6, 1 + Math.floor(score / 4) * .18);
  const faster = newSpeed > speed; speed = newSpeed; renderBoard(); BGM.setSpeed(speed);
  showScreen(`<div class="lbl">STAGE<i>面</i></div><div class="big">${String(round + 1).padStart(2, '0')}</div>${combo > 1 ? `<div>${combo} COMBO!</div>` : ''}${faster ? '<div>FASTER!! はやく!</div>' : ''}`);
  if (faster) { SFX.play('faster'); annSay('cheer', ['FASTER!!', 'スピードアップ!']) }
  setTimeout(startGame, faster ? 1300 : 900);
}

function gameOver() {
  cur = null; bar.style.width = '0';
  BGM.duck(true);
  const record = pts > best && pts > 0;
  if (record) { best = pts; try { localStorage.cozyPtsBest = best } catch (e) {} }
  renderBoard();
  showScreen(`<h1>GAME OVER</h1><div class="lbl">SCORE<i>得点</i></div><div class="big">${pad(pts)}</div><div class="lbl">HI-SCORE ${pad(best)}</div><div style="opacity:.6">click to play again</div>`, newRun);
  if (record) annSay('cheer', ['NEW RECORD, VERY BREAD!', 'しんきろく!']); else annSay('cry', ['GOOD EFFORT, LITTLE BEAN!', 'おつかれさま!'], 'lose');
}

function newRun() { BGM.start(); BGM.setSpeed(1); BGM.duck(false); score = 0; pts = 0; combo = 0; round = 0; lives = MAX_LIVES; speed = 1; renderLives(); renderBoard(); interlude() }

let last = performance.now();
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  drawSky(dt);
  if (down) { seg = prev ? { ax: prev.x, ay: prev.y, bx: mouse.x, by: mouse.y } : null; prev = { ...mouse } } else { seg = prev = null }
  if (live()) {
    cur.t += dt;
    if (cur.g.tick) cur.g.tick(dt, cur.t);
    bar.style.width = (100 * Math.max(0, 1 - cur.t / cur.dur)) + '%';
    const left = cur.dur - cur.t, q = Math.ceil(left * 4);
    BGM.tension(left < cur.dur * .38);
    if (left < 1 && q !== cur.tickQ) { cur.tickQ = q; SFX.play('tick', { vol: .5, rate: q % 2 ? 1 : 1.25 }) }
    if (live() && cur.t >= cur.dur) { if (cur.g.onTimeout) cur.g.onTimeout(); finish(cur.survive) }
  }
})(last);

renderLives(); renderBoard(); moodEl.style.width = mood * 10 + '%';
loadSprites().then(() => showScreen(
  `<h1>COZY CHAOS</h1><div>sprite edition — ${GAMES.length} games</div>
   <div class="row"><img src="sprites/drop.png"><img src="sprites/sheep_idle.png"><img src="sprites/loaf_happy.png"><img src="sprites/carrot_slapme.png"><img src="sprites/mole_happy.png"></div>
   <div style="opacity:.6">click the screen to start</div>`, newRun));
</script>
</body>
</html>
